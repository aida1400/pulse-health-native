name: Build Pulse Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile 100% Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Preserve Custom Native Assets
        run: |
          mkdir -p /tmp/pulse_native_backup
          cp -f android/app/src/main/AndroidManifest.xml /tmp/pulse_native_backup/AndroidManifest.xml 2>/dev/null || true
          cp -rf android/app/src/main/kotlin /tmp/pulse_native_backup/ 2>/dev/null || true
          cp -rf android/app/src/main/res/raw /tmp/pulse_native_backup/ 2>/dev/null || true
          cp -rf android/app/src/main/res/values /tmp/pulse_native_backup/ 2>/dev/null || true

      - name: Scaffold Standard Android Wrapper & Configure Desugaring
        run: |
          flutter create . --org com.pulse --project-name health --platforms=android
          python3 -c '
          import glob
          for f in glob.glob("android/app/build.gradle*"):
              with open(f, "r", encoding="utf-8") as fp:
                  c = fp.read()
              is_kts = f.endswith(".kts")
              c = c.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              c = c.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
              if "DesugaringEnabled" not in c:
                  if is_kts:
                      c = c.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  else:
                      c = c.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              if "coreLibraryDesugaring" not in c:
                  dep_line = "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n" if is_kts else "    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n"
                  if "dependencies {" in c:
                      c = c.replace("dependencies {", f"dependencies {{\n{dep_line}")
                  else:
                      c += f"\ndependencies {{\n{dep_line}}}\n"
              with open(f, "w", encoding="utf-8") as fp:
                  fp.write(c)
          print("Successfully configured build.gradle for desugaring & minSdk 23!")
          '

      - name: Restore Custom Native Code & Manifest
        run: |
          rm -rf android/app/src/main/kotlin/*
          cp -rf /tmp/pulse_native_backup/kotlin/* android/app/src/main/kotlin/
          cp -f /tmp/pulse_native_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          cp -rf /tmp/pulse_native_backup/raw/* android/app/src/main/res/raw/
          cp -rf /tmp/pulse_native_backup/values/* android/app/src/main/res/values/

      - name: Resolve Flutter Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK Output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Pulse_Health_Native.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse_Health_Native_APK
          path: build/app/outputs/flutter-apk/Pulse_Health_Native.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Pulse Health Native v1.3.0
          body: "Official 100% Native Android Build for Pulse Health v1.3.0. Major Updates: Guaranteed Heads-up Notifications with sound and vibration, Right-side Hamburger Navigation Menu, Reply to Message, Edit & Delete Message, Real-time Online/Offline Presence & Typing Indicator, Deep Dark Crimson Red Luxury Theme, Profile Avatar Chooser, Streamlined Onboarding without forced partner code, and Explicit LTR Code Alignment."
          files: build/app/outputs/flutter-apk/Pulse_Health_Native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
