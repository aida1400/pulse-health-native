name: pulse_app
description: "Pulse - 100% Native Encrypted Stealth Communication Android App"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Security & Real Hardware Biometrics
  local_auth: ^2.1.8
  encrypt: ^5.0.3
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  
  # Sensors & Hardware (Flip Face-Down, Shake, Haptic Heartbeat)
  sensors_plus: ^5.0.1
  wakelock_plus: ^1.2.1
  
  # Native Notifications & Audio
  flutter_local_notifications: ^17.1.0
  audioplayers: ^6.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - android/app/src/main/res/raw/soft_pulse.ogg
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-400.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-600.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-700.ttf
          weight: 700
